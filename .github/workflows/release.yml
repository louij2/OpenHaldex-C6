name: Release

# Cut a release from a tag, so the published binaries and the index that
# describes them are produced by the same run and cannot drift apart. This is
# the whole point: upstream's index was written by a local script that was not
# always re-run after a rebuild, so "V9.00.0" ended up naming two binaries.
#
# Usage:
#   1. bump FW_VERSION in include/OpenHaldexC6_ver.h and "fs" in
#      data/version.json to the same value, commit, push.
#   2. git tag v9.10.0 && git push origin v9.10.0
#
# The tag must match FW_VERSION or the run fails - that mismatch is how a
# release ends up mislabelled.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and check the version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FW=$(python3 -c "import re;print(re.search(r'#define\s+FW_VERSION\s+\"([^\"]+)\"',open('include/OpenHaldexC6_ver.h').read()).group(1))")
          FS=$(python3 -c "import json;print(json.load(open('data/version.json'))['fs'])")
          echo "tag=$TAG  FW_VERSION=$FW  fs=$FS"
          if [ "$TAG" != "$FW" ] || [ "$FW" != "$FS" ]; then
            echo "::error::tag ($TAG), FW_VERSION ($FW) and data/version.json ($FS) must all match."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: |
          pio run -e esp32c6
          pio run -e esp32c6 -t buildfs

      # No --notes: make_release.py takes them from this version's changelog
      # entry in include/OpenHaldexC6_ver.h, so the notes shown in the device's
      # update list are the ones already written there. Nothing from the commit
      # message is interpolated into a shell argument.
      - name: Stage and index the release
        run: |
          python3 tools/make_release.py add "${{ steps.ver.outputs.version }}" \
            --firmware   .pio/build/esp32c6/firmware.bin \
            --filesystem .pio/build/esp32c6/littlefs.bin \
            --bootloader .pio/build/esp32c6/bootloader.bin \
            --partitions .pio/build/esp32c6/partitions.bin
          python3 tools/make_release.py verify

      - name: Commit the release to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Releases/
          git commit -m "Release ${{ steps.ver.outputs.version }} (built in CI)"
          git push origin HEAD:main

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            Releases/V${{ steps.ver.outputs.version }}/firmware.bin
            Releases/V${{ steps.ver.outputs.version }}/littlefs.bin
            Releases/V${{ steps.ver.outputs.version }}/bootloader.bin
            Releases/V${{ steps.ver.outputs.version }}/partitions.bin
